<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Chat Web App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden">

  <!-- SCREEN 1: LOGIN & REGISTER -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
      <h2 id="auth-title" class="text-2xl font-bold text-center mb-2 text-emerald-400">Login Chat System</h2>
      <p id="auth-subtitle" class="text-xs text-slate-400 text-center mb-6">Masukan ID dan Password kamu untuk masuk</p>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-300">Nomor ID Unik</label>
          <input type="text" id="auth-id" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 mt-1 text-white" placeholder="Misal: STAF001">
        </div>
        <div id="name-field" class="hidden">
          <label class="text-xs font-semibold text-slate-300">Nama Lengkap</label>
          <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 mt-1 text-white" placeholder="Nama Anda">
        </div>
        <div id="coordinator-field" class="hidden">
          <label class="text-xs font-semibold text-slate-300">Pilih Koordinator</label>
          <select id="auth-coordinator" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 mt-1 text-white">
            <option value="">-- Pilih Koordinator --</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300">Password</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 mt-1 text-white" placeholder="••••••••">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-3 rounded-xl transition text-sm">Masuk Sekarang</button>
      </form>

      <div class="mt-4 text-center">
        <button id="toggle-auth-btn" class="text-xs text-emerald-400 hover:underline">Belum punya akun Staf? Daftar di sini</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: CHAT DASHBOARD -->
  <div id="app-screen" class="hidden w-full h-full flex">
    <!-- SIDEBAR -->
    <aside class="w-80 md:w-96 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
      <div>
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-lg" id="user-avatar">?</div>
            <div>
              <h4 class="font-semibold text-sm" id="user-name-display">-</h4>
              <p class="text-xs text-emerald-400 font-medium" id="user-role-display">-</p>
            </div>
          </div>
          <button id="logout-btn" title="Logout" class="p-2 hover:bg-slate-800 rounded-xl text-slate-400 hover:text-red-400 transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </div>

        <!-- MENU PERSATUAN / NOTIFIKASI PERSETUJUAN -->
        <div id="pending-section" class="hidden p-3 border-b border-slate-800 bg-amber-500/10">
          <p class="text-xs font-bold text-amber-400 uppercase mb-2 flex items-center">
            <i data-lucide="user-check" class="w-4 h-4 mr-1"></i> Persetujuan Staf Baru
          </p>
          <div id="pending-list" class="space-y-2 max-h-40 overflow-y-auto">
            <!-- Pending items render here -->
          </div>
        </div>

        <div class="p-3">
          <p class="text-xs font-bold text-slate-500 uppercase px-2 mb-2">Daftar Percakapan</p>
          <div id="room-list" class="space-y-1 overflow-y-auto max-h-[calc(100vh-200px)]">
            <!-- Room items will render here -->
          </div>
        </div>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="flex-1 flex flex-col bg-slate-950">
      <header class="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
        <div>
          <h3 class="font-bold text-sm text-slate-100" id="current-room-title">Pilih ruang chat untuk memulai</h3>
          <p class="text-xs text-slate-400" id="current-room-sub">-</p>
        </div>
      </header>

      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center text-slate-600 text-xs my-auto">Pilih salah satu obrolan di menu sebelah kiri.</div>
      </div>

      <form id="chat-form" class="p-3 border-t border-slate-800 bg-slate-900/50 flex items-center space-x-2">
        <input type="text" id="chat-input" placeholder="Ketik pesan..." required class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 p-2.5 rounded-xl transition"><i data-lucide="send" class="w-4 h-4"></i></button>
      </form>
    </main>
  </div>

  <script>
    // === KONFIGURASI SUPABASE ===
    const SUPABASE_URL = 'https://mbhdkjuqejcilqifpeoi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ptBIvCMuOXLjOV3UR3HQbQ_vDI6cXWf';

    // Inisialisasi Supabase Client
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // STATE SYSTEM
    let currentUser = null;
    let currentRoomId = null;
    let isRegisterMode = false;
    let activeChannel = null;

    // DOM ELEMENTS
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const authForm = document.getElementById('auth-form');
    const toggleAuthBtn = document.getElementById('toggle-auth-btn');
    const roomList = document.getElementById('room-list');
    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');

    // TOGGLE REGISTER/LOGIN
    toggleAuthBtn.addEventListener('click', async () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? 'Pendaftaran Staf' : 'Login Chat System';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Daftar Sekarang' : 'Masuk Sekarang';
      document.getElementById('name-field').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('coordinator-field').classList.toggle('hidden', !isRegisterMode);
      toggleAuthBtn.innerText = isRegisterMode ? 'Sudah punya akun? Login di sini' : 'Belum punya akun Staf? Daftar di sini';

      if (isRegisterMode) {
        const { data } = await supabaseClient.from('users').select('id, name').eq('role', 'koordinator');
        const select = document.getElementById('auth-coordinator');
        select.innerHTML = '<option value="">-- Pilih Koordinator --</option>';
        data?.forEach(c => select.innerHTML += `<option value="${c.id}">${c.name}</option>`);
      }
    });

    // AUTH SUBMIT
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('auth-id').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (isRegisterMode) {
        const name = document.getElementById('auth-name').value.trim();
        const coordinator_id = document.getElementById('auth-coordinator').value;
        if (!coordinator_id) return alert('Pilih Koordinator!');

        const { error } = await supabaseClient.from('users').insert([{ id, name, password, role: 'staf', pending_coordinator_id: coordinator_id }]);
        if (error) return alert('Gagal Daftar: ' + error.message);
        alert('Pendaftaran Berhasil! Silakan tunggu konfirmasi koordinator Anda.');
        location.reload();
      } else {
        const { data, error } = await supabaseClient.from('users').select('*').eq('id', id).eq('password', password).single();
        if (error || !data) return alert('ID atau Password Salah!');
        
        // Cek jika status staf masih pending
        if (data.role === 'staf' && !data.coordinator_id && data.pending_coordinator_id) {
          return alert('Akun Anda masih dalam proses persetujuan oleh Koordinator!');
        }

        currentUser = data;
        initApp();
      }
    });

    // INIT APP AFTER LOGIN
    async function initApp() {
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      document.getElementById('user-name-display').innerText = currentUser.name;
      document.getElementById('user-role-display').innerText = currentUser.role.toUpperCase() + ` (${currentUser.id})`;
      document.getElementById('user-avatar').innerText = currentUser.name ? currentUser.name.charAt(0) : 'U';

      loadPendingStaff();
      loadRooms();
    }

    // LOAD PENDING STAFF FOR COORDINATOR / ADMIN
    async function loadPendingStaff() {
      if (currentUser.role !== 'koordinator' && currentUser.role !== 'admin') return;

      let query = supabaseClient.from('users').select('*').not('pending_coordinator_id', 'is', null);
      if (currentUser.role === 'koordinator') {
        query = query.eq('pending_coordinator_id', currentUser.id);
      }

      const { data } = await query;
      const section = document.getElementById('pending-section');
      const list = document.getElementById('pending-list');

      if (data && data.length > 0) {
        section.classList.remove('hidden');
        list.innerHTML = '';
        data.forEach(staf => {
          list.innerHTML += `
            <div class="bg-slate-800 p-2 rounded-lg flex items-center justify-between">
              <div>
                <p class="text-xs font-bold text-slate-200">${staf.name}</p>
                <p class="text-[10px] text-slate-400">ID: ${staf.id}</p>
              </div>
              <div class="flex space-x-1">
                <button onclick="approveStaff('${staf.id}', '${staf.pending_coordinator_id}')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-2 py-1 rounded text-[10px]">Terima</button>
                <button onclick="rejectStaff('${staf.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-2 py-1 rounded text-[10px]">Tolak</button>
              </div>
            </div>
          `;
        });
      } else {
        section.classList.add('hidden');
      }
    }

    // APPROVE STAFF
    async function approveStaff(stafId, coordId) {
      const { error } = await supabaseClient.from('users').update({ 
        coordinator_id: coordId, 
        pending_coordinator_id: null 
      }).eq('id', stafId);

      if (error) return alert('Gagal menyetujui staf: ' + error.message);
      alert('Staf berhasil diterima!');
      loadPendingStaff();
    }

    // REJECT STAFF
    async function rejectStaff(stafId) {
      if (!confirm('Yakin ingin menolak pendaftaran staf ini?')) return;
      const { error } = await supabaseClient.from('users').delete().eq('id', stafId);
      if (error) return alert('Gagal menolak staf: ' + error.message);
      alert('Pendaftaran staf ditolak.');
      loadPendingStaff();
    }

    // LOAD ROOMS
    async function loadRooms() {
      let rooms = [{ id: '00000000-0000-0000-0000-000000000001', name: '📢 GRUP UMUM', type: 'general' }];
      
      const coordId = currentUser.role === 'koordinator' ? currentUser.id : currentUser.coordinator_id;
      if (coordId) {
        const { data: teamRoom } = await supabaseClient.from('rooms').select('*').eq('coordinator_id', coordId).single();
        if (teamRoom) rooms.push(teamRoom);
      }

      roomList.innerHTML = '';
      rooms.forEach(room => {
        roomList.innerHTML += `
          <div onclick="selectRoom('${room.id}', '${room.name}')" class="p-3 rounded-xl bg-slate-800/40 hover:bg-slate-800 cursor-pointer border border-slate-800 flex items-center space-x-3 transition">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">#</div>
            <div class="font-semibold text-xs text-slate-200">${room.name}</div>
          </div>
        `;
      });
    }

    // SELECT ROOM & LISTEN TO REALTIME
    async function selectRoom(roomId, roomName) {
      currentRoomId = roomId;
      document.getElementById('current-room-title').innerText = roomName;
      loadMessages();

      if (activeChannel) supabaseClient.removeChannel(activeChannel);

      activeChannel = supabaseClient.channel(`room-${roomId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, 
          payload => renderMessage(payload.new)
        ).subscribe();
    }

    // LOAD MESSAGES HISTORY
    async function loadMessages() {
      messagesContainer.innerHTML = '';
      const { data } = await supabaseClient.from('messages').select('*, users(name)').eq('room_id', currentRoomId).order('created_at', { ascending: true });
      data?.forEach(renderMessage);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // RENDER MESSAGE BUBBLE
    function renderMessage(msg) {
      const isMe = msg.sender_id === currentUser.id;
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      msgDiv.innerHTML = `
        <span class="text-[10px] text-slate-500 mb-0.5">${msg.users?.name || msg.sender_id}</span>
        <div class="${isMe ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'} rounded-2xl p-3 text-xs max-w-md">
          ${msg.content}
        </div>
      `;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // SEND MESSAGE
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content || !currentRoomId) return;

      input.value = '';
      await supabaseClient.from('messages').insert([{ room_id: currentRoomId, sender_id: currentUser.id, content }]);
    });

    document.getElementById('logout-btn').addEventListener('click', () => location.reload());
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
